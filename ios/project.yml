name: Xiaomeishuo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
targets:
  Xiaomeishuo:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: Xiaomeishuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xiaomeishuo
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Xiaomeishuo/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: zh-Hans
    scheme:
      testTargets: []
