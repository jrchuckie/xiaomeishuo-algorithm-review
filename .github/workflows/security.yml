name: Security and tests

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security scan
        run: bash scripts/security_scan.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          cd backend
          MODEL_MODE=mock python -m pytest -q

  ios-typecheck:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Type-check iPhone app against iOS 17 SDK
        run: bash ios/check-ios.sh
